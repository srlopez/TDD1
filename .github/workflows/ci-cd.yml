name: Java CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Test (CI)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [17,21]

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: maven

      - name: Compilar y Ejecutar Pruebas Unitarias
        run: mvn clean test

      - name: Generar Paquete JAR
        run: mvn package -DskipTests

      - name: Guardar la Calculadora compilada
        uses: actions/upload-artifact@v4
        with:
          name: calculator-app-java${{matrix.java-version}}
          path: target/*.jar

  release:
    name: Create GitHub Release (CD)
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest


    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
      
      - name: Compilar y ejecutar test
        run: mvn clean test

      - name: Construir JAR Final
        run: mvn clean package 



      - name: Crear GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: target/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}